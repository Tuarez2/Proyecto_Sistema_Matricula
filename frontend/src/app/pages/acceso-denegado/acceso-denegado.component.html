<section class="pagina-acceso-denegado" aria-labelledby="titulo-acceso-denegado">
  <svg
    class="acceso-denegado__icono"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <rect x="3" y="11" width="18" height="11" rx="2" />
    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
  </svg>

  <h1 id="titulo-acceso-denegado">Acceso denegado</h1>
  <p class="acceso-denegado__descripcion">
    Su rol no tiene permisos para acceder a esta sección del sistema. Si cree
    que esto es un error, contacte al administrador.
  </p>

  <div class="acceso-denegado__acciones">
    <a [routerLink]="rutaInicial()" class="btn btn-primary">
      Volver a su inicio
    </a>

    <button
      type="button"
      class="btn btn-link"
      [disabled]="cerrandoSesion()"
      (click)="cerrarSesion()"
    >
      @if (cerrandoSesion()) {
        Cerrando sesión...
      } @else {
        Cerrar sesión
      }
    </button>
  </div>
</section>
