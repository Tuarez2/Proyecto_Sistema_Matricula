<section aria-labelledby="titulo-malla"><h1 id="titulo-malla">Malla curricular</h1>@if(mensajeError()){<p role="alert">{{mensajeError()}}</p>}<form [formGroup]="formulario"><label>Carrera <select formControlName="carreraId" (change)="consultar()"><option value="">Seleccione</option>@for(c of carreras();track c.id){<option [value]="c.id">{{c.nombre}}</option>}</select></label><label>Asignatura <select formControlName="asignaturaId"><option value="">Seleccione</option>@for(a of asignaturas();track a.id){<option [value]="a.id">{{a.nombre}}</option>}</select></label><button type="button" (click)="asignar()" [disabled]="cargando()">Asociar asignatura</button></form><h2>Asignaturas de la carrera</h2><ul>@for(a of asignaciones();track a.carrera_id+'-'+a.asignatura_id){<li>{{nombreAsignatura(a)}} <button type="button" (click)="eliminar(a)">Quitar</button></li>}</ul></section>
