<section class="pagina-docente" aria-labelledby="titulo-editar-docente">
  <h1 id="titulo-editar-docente">Editar docente</h1>

  @if (mensajeExito()) {
    <p role="status">{{ mensajeExito() }}</p>
  }

  @if (mensajeError()) {
    <p role="alert">{{ mensajeError() }}</p>
  }

  @if (cargandoDocente()) {
    <p role="status" aria-live="polite">Consultando docente...</p>
  }

  @if (docente()) {
    <app-docente-form
      [docenteInicial]="docente()"
      [modoEdicion]="true"
      [enviando]="enviando()"
      (guardarDocente)="guardarDocente($event)"
      (cancelarFormulario)="cancelar()"
    />
  }
</section>
