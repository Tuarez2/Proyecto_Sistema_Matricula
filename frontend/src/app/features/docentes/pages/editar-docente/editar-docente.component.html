<section class="pagina-docente">
  <h1>Editar docente</h1>

  @if (docente) {
    <app-docente-form
      [initialData]="docente"
      [isEdit]="true"
      (onSave)="guardar($event)"
      (onCancel)="cancelar()"
    />
  } @else if (docenteNoEncontrado) {
    <p class="mensaje-vacio">No se encontró el docente solicitado.</p>
  }
</section>
