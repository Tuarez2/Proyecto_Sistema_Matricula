<section class="pagina-docente" aria-labelledby="titulo-crear-docente">
  <app-boton-atras />
  <h1 id="titulo-crear-docente">Registrar docente</h1>

  @if (mensajeExito()) {
    <p role="status">{{ mensajeExito() }}</p>
  }

  @if (mensajeError()) {
    <p role="alert">{{ mensajeError() }}</p>
  }

  <app-docente-form
    [enviando]="enviando()"
    (guardarDocente)="guardarDocente($event)"
    (cancelarFormulario)="cancelar()"
  />
</section>
