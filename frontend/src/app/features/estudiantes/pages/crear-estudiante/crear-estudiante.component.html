<section aria-labelledby="titulo-crear-estudiante">
  <app-boton-atras />
  <h1 id="titulo-crear-estudiante">Registrar estudiante</h1>

  @if (mensajeExito()) {
    <p role="status">{{ mensajeExito() }}</p>
  }

  @if (mensajeError()) {
    <p role="alert">{{ mensajeError() }}</p>
  }

  @if (cargandoCarreras()) {
    <p role="status" aria-live="polite">Consultando carreras...</p>
  }

  <app-estudiante-form
    [carreras]="carreras()"
    [cargandoCarreras]="cargandoCarreras()"
    [enviando]="enviando()"
    (guardarEstudiante)="guardarEstudiante($event)"
    (cancelarFormulario)="cancelar()"
  />
</section>
