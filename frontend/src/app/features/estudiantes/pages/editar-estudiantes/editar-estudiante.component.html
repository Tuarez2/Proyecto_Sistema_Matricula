<section aria-labelledby="titulo-editar-estudiante">
  <h1 id="titulo-editar-estudiante">Editar estudiante</h1>

  @if (mensajeExito()) {
    <p role="status">{{ mensajeExito() }}</p>
  }

  @if (mensajeError()) {
    <p role="alert">{{ mensajeError() }}</p>
  }

  @if (cargandoEstudiante()) {
    <p role="status" aria-live="polite">Consultando estudiante...</p>
  }

  @if (cargandoCarreras()) {
    <p role="status" aria-live="polite">Consultando carreras...</p>
  }

  @if (estudiante()) {
    <app-estudiante-form
      [estudianteInicial]="estudiante()"
      [carreras]="carreras()"
      [modoEdicion]="true"
      [cargandoCarreras]="cargandoCarreras()"
      [enviando]="enviando()"
      (guardarEstudiante)="guardarEstudiante($event)"
      (cancelarFormulario)="cancelar()"
    />
  }
</section>
