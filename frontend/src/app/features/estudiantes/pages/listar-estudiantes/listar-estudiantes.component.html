<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestión de Estudiantes</h2>
    <button class="btn btn-primary" (click)="navegarACrear()">+ Nuevo Estudiante</button>
  </div>

  <!-- Componente Filtros -->
  <app-estudiante-filter (onFilter)="cargarEstudiantes($event)"></app-estudiante-filter>

  <!-- Componente Tabla -->
  <app-estudiante-table
    [estudiantes]="estudiantes"
    (onEdit)="navegarAEditar($event)"
    (onDelete)="eliminarEstudiante($event)">
  </app-estudiante-table>
</div>
