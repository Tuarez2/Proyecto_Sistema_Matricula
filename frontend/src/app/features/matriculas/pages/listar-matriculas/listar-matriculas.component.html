<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Consulta de Matrículas</h2>
    <a routerLink="/matriculas/crear" class="btn btn-success">+ Nueva Matrícula</a>
  </div>

  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th>ID</th>
        <th>Estudiante</th>
        <th>Periodo</th>
        <th>Asignaturas</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let mat of matriculas">
        <td>#{{ mat.id }}</td>
        <td>{{ mat.estudianteNombre || mat.estudianteId }}</td>
        <td>{{ mat.periodoLectivo }}</td>
        <td>
          <span class="badge bg-secondary me-1" *ngFor="let det of mat.detalles">
            {{ det.codigoCurso || det.cursoId }}
          </span>
        </td>
        <td>
          <span class="badge" [ngClass]="{
            'bg-success': mat.estado === 'REGISTRADA',
            'bg-danger': mat.estado === 'ANULADA',
            'bg-primary': mat.estado === 'FINALIZADA'
          }">{{ mat.estado }}</span>
        </td>
        <td>
          <button *ngIf="mat.estado === 'REGISTRADA'" (click)="cambiarEstado(mat.id, 'ANULADA')" class="btn btn-sm btn-outline-danger me-1">Anular</button>
          <button *ngIf="mat.estado === 'REGISTRADA'" (click)="cambiarEstado(mat.id, 'FINALIZADA')" class="btn btn-sm btn-outline-primary">Finalizar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
