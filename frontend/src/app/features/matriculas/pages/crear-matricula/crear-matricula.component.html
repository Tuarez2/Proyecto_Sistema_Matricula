<div class="container mt-4">
  <h2>Registrar Nueva Matrícula</h2>

  <!-- Alerta para Errores y Conflictos del Backend -->
  <div *ngIf="errorMessage" class="alert alert-danger mt-3 alert-dismissible fade show" role="alert">
    <strong>Error de Validación:</strong> {{ errorMessage }}
    <ul *ngIf="conflictos.length > 0" class="mb-0 mt-2">
      <li *ngFor="let c of conflictos">{{ c }}</li>
    </ul>
  </div>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="mt-3">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Estudiante</label>
        <select formControlName="estudianteId" class="form-select">
          <option value="">-- Seleccionar Estudiante --</option>
          <option *ngFor="let est of estudiantes" [value]="est.id">
            {{ est.cedula }} - {{ est.nombres }} {{ est.apellidos }}
          </option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Periodo Lectivo</label>
        <input type="text" formControlName="periodoLectivo" class="form-control" placeholder="Ej: 2026-1" />
      </div>

      <div class="col-12 mt-4">
        <h5>Selección de Asignaturas / Cursos</h5>
        <div class="list-group mt-2">
          <label *ngFor="let curso of cursos" class="list-group-item d-flex justify-content-between align-items-center">
            <div>
              <input class="form-check-input me-2" type="checkbox" [value]="curso.id" (change)="onCheckboxChange($event)" />
              <strong>[{{ curso.codigo }}]</strong> {{ curso.nombre }} ({{ curso.creditos }} Créditos)
            </div>
            <span class="badge bg-info text-dark">Docente: {{ curso.docenteNombre || 'Por asignar' }}</span>
          </label>
        </div>
      </div>
    </div>

    <div class="mt-4">
      <button type="submit" class="btn btn-primary me-2" [disabled]="form.invalid">Confirmar Matrícula</button>
      <a routerLink="/matriculas" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
