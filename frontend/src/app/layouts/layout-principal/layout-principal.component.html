<header class="encabezado-principal">
  <div class="contenedor barra-superior">
    <p class="marca">Sistema de Matrícula Universitaria</p>

    <nav class="navegacion-principal" aria-label="Navegación principal">
      <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/periodos-academicos" routerLinkActive="activo">Periodos académicos</a>
      <a routerLink="/facultades" routerLinkActive="activo">Facultades</a>
      <a routerLink="/carreras" routerLinkActive="activo">Carreras</a>
      <a routerLink="/asignaturas" routerLinkActive="activo">Asignaturas</a>
      <a routerLink="/malla-curricular" routerLinkActive="activo">Malla</a>
      <a routerLink="/cursos" routerLinkActive="activo">Cursos</a>
      <a routerLink="/estudiantes" routerLinkActive="activo">Estudiantes</a>
      <a routerLink="/docentes" routerLinkActive="activo">Docentes</a>
      @if (esAdministrador()) {
        <a routerLink="/usuarios" routerLinkActive="activo">Usuarios</a>
      }
    </nav>

    <section class="sesion-actual" aria-label="Sesión actual">
      <div>
        <p class="nombre-usuario">{{ nombreCompletoUsuario() }}</p>
        <p class="rol-usuario">{{ nombreRolUsuario() }}</p>
      </div>

      <button
        type="button"
        [disabled]="cerrandoSesion()"
        (click)="cerrarSesion()"
      >
        @if (cerrandoSesion()) {
          Cerrando sesión...
        } @else {
          Cerrar sesión
        }
      </button>
    </section>
  </div>
</header>

<main class="contenido-principal contenedor">
  <router-outlet />
</main>
