<header>
  <p>Sistema de Matrícula Universitaria</p>

  <nav aria-label="Navegación principal">
    <a routerLink="/">Inicio</a>
    @if (esAdministrador()) {
      <a routerLink="/usuarios">Usuarios</a>
    }
  </nav>

  <section aria-label="Sesión actual">
    <p>{{ nombreCompletoUsuario() }}</p>
    <p>{{ nombreRolUsuario() }}</p>

    <button
      type="button"
      [disabled]="cerrandoSesion()"
      (click)="cerrarSesion()"
    >
      @if (cerrandoSesion()) {
        Cerrando sesión...
      } @else {
        Cerrar sesión
      }
    </button>
  </section>
</header>

<main>
  <router-outlet />
</main>
