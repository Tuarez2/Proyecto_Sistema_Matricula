@if (isOpen) {
  <div class="modal-fondo" (click)="onCancel()">
    <div
      class="modal-contenedor"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="titulo"
      (click)="$event.stopPropagation()"
    >
      <div class="modal-contenedor__cabecera">
        <h2>{{ titulo }}</h2>
        <button type="button" class="modal-contenedor__cerrar" aria-label="Cerrar" (click)="onCancel()">
          ×
        </button>
      </div>

      <div class="modal-contenedor__cuerpo">
        <p>{{ mensaje }}</p>
      </div>

      <div class="modal-contenedor__acciones">
        <button type="button" class="btn btn-neutral" (click)="onCancel()">
          Cancelar
        </button>
        <button type="button" class="btn {{ btnClass }}" (click)="onConfirm()">
          Confirmar
        </button>
      </div>
    </div>
  </div>
}
