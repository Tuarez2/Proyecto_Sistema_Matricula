services:
  - type: web
    name: sistema-matricula-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm run db:seed:all && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGINS
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: INITIAL_ADMIN_FIRST_NAME
        value: Administrador
      - key: INITIAL_ADMIN_LAST_NAME
        value: Sistema
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
